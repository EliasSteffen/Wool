name: Leaderboard audit

# Monthly, not because anything changes on a schedule, but because the rows this
# catches are ones no code can remove - a client may only delete its own row, and
# a Firestore TTL policy needs a billing-enabled project. Somebody has to look,
# so this is the reminder to.
#
# The job fails when it finds duplicate names, which is what turns it into a
# notification: GitHub emails on a failed scheduled run, and a passing one stays
# quiet.
#
# Two caveats worth knowing. Scheduled runs only ever fire on the default branch,
# and GitHub disables them after 60 days without repository activity - it emails
# first. workflow_dispatch is here so the check is still one click away if that
# happens, or whenever you want to look between runs.
on:
  schedule:
    # 07:00 UTC on the 1st. Scheduled jobs are queued, not punctual - expect it
    # anywhere in the following hour.
    - cron: "0 7 1 * *"
  workflow_dispatch:

jobs:
  audit:
    name: Audit published rows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read-only, and the api_key it reads from the config resource is a public
      # project identifier that already ships in every client binary - so this
      # needs no secrets.
      - name: Report
        run: python3 tools/leaderboard_audit.py
